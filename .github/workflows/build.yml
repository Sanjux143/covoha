name: Build Sherpa-ONNX Android with QNN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: 'k2-fsa/sherpa-onnx'
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Download QNN SDK from HuggingFace
        run: |
          mkdir -p /home/runner/qnn_sdk
          cd /home/runner/qnn_sdk
          # Download official QAIRT SDK mirror
          wget -q https://huggingface.co/csukuangfj/sherpa-onnx-qnn/resolve/main/qairt-2.22.0.240424.zip -O qnn.zip
          unzip -q qnn.zip
          
          # Root directory find aur export karein
          QNN_DIR=$(find /home/runner/qnn_sdk -mindepth 1 -maxdepth 2 -type d -name "*2.22*" | head -n 1)
          echo "Found QNN SDK at: $QNN_DIR"
          echo "QNN_SDK_ROOT=$QNN_DIR" >> $GITHUB_ENV

      - name: Build Android arm64 with QNN
        run: |
          export SHERPA_ONNX_ENABLE_QNN=ON
          export SHERPA_ONNX_ENABLE_BINARY=ON
          export QNN_SDK_ROOT=${{ env.QNN_SDK_ROOT }}
          
          chmod +x ./build-android-arm64-v8a.sh
          ./build-android-arm64-v8a.sh

      - name: Upload Compiled .so & Binaries
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-android-qnn-arm64
          path: |
            build-android-arm64-v8a/install/lib/*
            build-android-arm64-v8a/install/bin/*
