name: Build Sherpa-ONNX Android with QNN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: 'k2-fsa/sherpa-onnx'
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Download & Setup QNN SDK (Doc Steps)
        run: |
          mkdir -p $HOME/qnn
          cd $HOME/qnn

          # Documentation URL with Browser User-Agent header
          wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.40.0.251030/v2.40.0.251030.zip \
            -O v2.40.0.251030.zip

          unzip -q v2.40.0.251030.zip

          # Documentation path match
          export QNN_SDK_ROOT=$HOME/qnn/qairt/2.40.0.251030
          echo "QNN_SDK_ROOT=$QNN_SDK_ROOT" >> $GITHUB_ENV

      - name: Build Android ARM64 with QNN
        run: |
          export SHERPA_ONNX_ENABLE_QNN=ON
          export SHERPA_ONNX_ENABLE_BINARY=ON
          export QNN_SDK_ROOT=${{ env.QNN_SDK_ROOT }}

          chmod +x ./build-android-arm64-v8a.sh
          ./build-android-arm64-v8a.sh

      - name: Upload .so Libraries and Binaries
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-android-qnn-arm64
          path: |
            build-android-arm64-v8a/install/lib/*
            build-android-arm64-v8a/install/bin/*
