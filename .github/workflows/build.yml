name: Build Sherpa-ONNX Android with QNN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: 'k2-fsa/sherpa-onnx'
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Download and Setup Qualcomm QNN SDK
        run: |
          mkdir -p /home/runner/qnn_sdk
          cd /home/runner/qnn_sdk
          # Download QAIRT / QNN SDK (v2.22.0 release)
          wget -q https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v2.22.0.240424.zip -O qnn.zip || \
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.9.0/qairt-2.22.0.240424.zip -O qnn.zip
          unzip -q qnn.zip
          QNN_DIR=$(find /home/runner/qnn_sdk -maxdepth 2 -type d -name "*qairt*" -o -name "*qnn*" | head -n 1)
          echo "QNN_SDK_ROOT=$QNN_DIR" >> $GITHUB_ENV

      - name: Build Android arm64 with QNN
        run: |
          export SHERPA_ONNX_ENABLE_QNN=ON
          export SHERPA_ONNX_ENABLE_BINARY=ON
          export QNN_SDK_ROOT=${{ env.QNN_SDK_ROOT }}
          
          ./build-android-arm64-v8a.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-android-qnn-arm64
          path: |
            build-android-arm64-v8a/install/lib/*
            build-android-arm64-v8a/install/bin/*
